name: Fix Relacion de Transito UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          new_func = '''def generar_relacion_transito_ui():

    """Abre directamente el selector general de materiales para la Relación de Tránsito."""

    tipo_movimiento = simpledialog.askstring(
        "Relación de Tránsito",
        "Tipo de movimiento:",
        parent=root,
    )
    if tipo_movimiento is None:
        return

    destino = simpledialog.askstring(
        "Relación de Tránsito",
        "Destino:",
        parent=root,
    )
    if destino is None:
        return

    transporte = simpledialog.askstring(
        "Relación de Tránsito",
        "Transporte:",
        parent=root,
    )
    if transporte is None:
        return

    nombre_archivo = f"RELACION DE TRANSITO_{datetime.now():%Y%m%d_%H%M%S}.xlsx"
    salida = filedialog.asksaveasfilename(
        parent=root,
        title="Guardar Relación de Tránsito",
        defaultextension=".xlsx",
        initialfile=nombre_archivo,
        filetypes=[("Excel", "*.xlsx")],
    )
    if not salida:
        return

    try:
        # Un material vacío activa el selector general de relacion_transito.py.
        # No se exige seleccionar previamente un material en la pantalla principal.
        generar_relacion_transito(
            materiales=[{}],
            salida=salida,
            tipo_movimiento=tipo_movimiento,
            destino=destino,
            transporte=transporte,
        )

        pdf_generado = getattr(
            generar_relacion_transito,
            "ultimo_pdf",
            None,
        )

        mensaje = f"La Relación de Tránsito se generó correctamente.\\n\\nArchivo Excel:\\n{salida}"
        if pdf_generado:
            mensaje += f"\\n\\nArchivo PDF:\\n{pdf_generado}"

        messagebox.showinfo(
            "Relación de Tránsito",
            mensaje,
            parent=root,
        )

    except RelacionTransitoError as error:
        traceback.print_exc()
        messagebox.showerror(
            "Relación de Tránsito",
            f"No se pudo generar la relación:\\n\\n{error}",
            parent=root,
        )

    except Exception as error:
        traceback.print_exc()
        messagebox.showerror(
            "Relación de Tránsito",
            f"Ocurrió un error inesperado:\\n\\n{error}",
            parent=root,
        )


'''

          patron = r'def generar_relacion_transito_ui\(\):.*?(?=\n# ={10,}\n)'
          nuevo, n = re.subn(patron, new_func.rstrip(), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró generar_relacion_transito_ui en main.py')
          p.write_text(nuevo, encoding='utf-8')
          PY

          rm -f .github/workflows/fix_transito_ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/fix_transito_ui.yml
          git commit -m 'fix: abrir selector general desde relacion de transito'
          git push
