name: Pulir tarjetas de inventarios

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar mejoras visuales
        shell: python
        run: |
          from pathlib import Path

          p = Path("main.py")
          s = p.read_text(encoding="utf-8")

          old = '''def construir_opciones_documentos(parent):\n\n    documentos = [\n'''
          new = '''def cambiar_fondo_recursivo(widget, color):\n\n    try:\n        widget.configure(bg=color)\n    except Exception:\n        pass\n\n    try:\n        for hijo in widget.winfo_children():\n            cambiar_fondo_recursivo(hijo, color)\n    except Exception:\n        pass\n\n\ndef construir_opciones_documentos(parent):\n\n    documentos = [\n'''
          if old not in s:
              raise SystemExit("No se encontró el inicio de construir_opciones_documentos")
          s = s.replace(old, new, 1)

          old = '''    ttk.Label(\n        parent,\n        text="Seleccioná el inventario",\n        font=("Segoe UI", 15, "bold"),\n    ).pack(\n        pady=(20, 5)\n    )\n\n    ttk.Label(\n        parent,\n        text="Cada archivo Word administra su propio stock.",\n        foreground=COLOR_TEXTO_SECUNDARIO,\n    ).pack(\n        pady=(0, 18)\n    )\n'''
          new = '''    ttk.Label(\n        parent,\n        text="📂 Seleccioná el inventario",\n        font=("Segoe UI", 17, "bold"),\n    ).pack(\n        pady=(24, 4)\n    )\n\n    ttk.Label(\n        parent,\n        text="Elegí el archivo Word cuyo inventario querés administrar.",\n        foreground=COLOR_TEXTO_SECUNDARIO,\n    ).pack(\n        pady=(0, 16)\n    )\n'''
          if old not in s:
              raise SystemExit("No se encontró el encabezado del selector")
          s = s.replace(old, new, 1)

          old = '''        tarjeta = tk.Frame(\n            cont,\n            bg=COLOR_PANEL,\n            highlightbackground=COLOR_BORDE,\n            highlightthickness=1,\n            padx=18,\n            pady=15,\n            cursor="hand2",\n        )\n'''
          new = '''        tarjeta = tk.Frame(\n            cont,\n            bg=COLOR_PANEL,\n            highlightbackground=COLOR_BORDE,\n            highlightthickness=1,\n            padx=18,\n            pady=16,\n            cursor="hand2",\n        )\n'''
          if old not in s:
              raise SystemExit("No se encontró la tarjeta")
          s = s.replace(old, new, 1)

          old = '''        icono = tk.Label(\n            tarjeta,\n            text="📄",\n            bg=COLOR_PANEL,\n            fg=COLOR_AZUL,\n            font=("Segoe UI", 24),\n            cursor="hand2",\n        )\n'''
          new = '''        icono = tk.Label(\n            tarjeta,\n            text="📄",\n            bg=COLOR_PANEL,\n            fg=COLOR_AZUL,\n            font=("Segoe UI", 26),\n            cursor="hand2",\n        )\n'''
          if old not in s:
              raise SystemExit("No se encontró el icono")
          s = s.replace(old, new, 1)

          old = '''        etiqueta_descripcion = tk.Label(\n            info,\n            text="Abrir inventario",\n            bg=COLOR_PANEL,\n            fg=COLOR_TEXTO_SECUNDARIO,\n            font=("Segoe UI", 9),\n            anchor="w",\n            cursor="hand2",\n        )\n'''
          new = '''        etiqueta_descripcion = tk.Label(\n            info,\n            text="Inventario disponible · Abrir para consultar y gestionar stock",\n            bg=COLOR_PANEL,\n            fg=COLOR_TEXTO_SECUNDARIO,\n            font=("Segoe UI", 9),\n            anchor="w",\n            cursor="hand2",\n        )\n'''
          if old not in s:
              raise SystemExit("No se encontró la descripción")
          s = s.replace(old, new, 1)

          old = '''        boton.pack(\n            anchor="w"\n        )\n\n        tarjeta.bind(\n            "<Button-1>",\n            abrir_documento,\n        )\n'''
          new = '''        boton.pack(\n            anchor="w"\n        )\n\n        def tarjeta_entrada(event=None, tarjeta=tarjeta):\n            cambiar_fondo_recursivo(\n                tarjeta,\n                COLOR_AZUL_CLARO,\n            )\n            tarjeta.configure(\n                highlightbackground=COLOR_AZUL,\n                highlightthickness=2,\n            )\n\n        def tarjeta_salida(event=None, tarjeta=tarjeta):\n            cambiar_fondo_recursivo(\n                tarjeta,\n                COLOR_PANEL,\n            )\n            tarjeta.configure(\n                highlightbackground=COLOR_BORDE,\n                highlightthickness=1,\n            )\n\n        def vincular_hover(widget):\n            widget.bind(\n                "<Enter>",\n                tarjeta_entrada,\n                add="+",\n            )\n            widget.bind(\n                "<Leave>",\n                tarjeta_salida,\n                add="+",\n            )\n\n        for widget in (\n            tarjeta,\n            icono,\n            info,\n            etiqueta_nombre,\n            etiqueta_descripcion,\n        ):\n            vincular_hover(widget)\n\n        tarjeta.bind(\n            "<Button-1>",\n            abrir_documento,\n        )\n'''
          if old not in s:
              raise SystemExit("No se encontró el bloque de eventos de la tarjeta")
          s = s.replace(old, new, 1)

          old = '''        etiqueta_descripcion.bind(\n            "<Button-1>",\n            abrir_documento,\n        )\n'''
          new = '''        etiqueta_descripcion.bind(\n            "<Button-1>",\n            abrir_documento,\n        )\n\n        boton.bind(\n            "<Enter>",\n            tarjeta_entrada,\n            add="+",\n        )\n        boton.bind(\n            "<Leave>",\n            tarjeta_salida,\n            add="+",\n        )\n'''
          if old not in s:
              raise SystemExit("No se encontró el cierre de eventos")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

      - name: Validar sintaxis
        run: python -m py_compile main.py

      - name: Commit y limpieza
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet && { echo "No hubo cambios"; exit 0; }
          git commit -m "Pulir tarjetas de seleccion de inventarios"
          git push
          git rm .github/workflows/pulir_tarjetas_inventarios.yml
          git commit -m "Eliminar workflow temporal de pulido"
          git push
