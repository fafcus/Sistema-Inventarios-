name: Fix inventory selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-selector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace selector implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          inicio = text.find("def construir_opciones_documentos(parent):")
          if inicio < 0:
              raise SystemExit("No se encontró construir_opciones_documentos")

          fin = text.find("# ============================================================\n# MOSTRAR SELECTOR", inicio)
          if fin < 0:
              raise SystemExit("No se encontró el final del selector")

          nuevo = '''def construir_opciones_documentos(parent):
    """Construye el selector de inventarios usando el nombre almacenado en Supabase.

    La interfaz no depende de la ruta local del archivo Word. El nombre se
    muestra directamente como texto visible y también dentro del botón de
    apertura, por lo que funciona igual aunque cada PC tenga otra ruta local.
    """

    documentos = []

    for documento in obtener_documentos_cache():
        if not isinstance(documento, dict):
            continue

        nombre = limpiar_texto(documento.get("nombre"))

        if not nombre:
            ruta = limpiar_texto(documento.get("ruta")).replace("\\\\", "/")
            if ruta:
                nombre = ruta.rsplit("/", 1)[-1].strip()

        if not nombre:
            nombre = f"Inventario #{documento.get('id', '')}".strip()

        documento_visible = dict(documento)
        documento_visible["nombre"] = nombre
        documentos.append(documento_visible)

    documentos.sort(
        key=lambda documento: limpiar_texto(
            documento.get("nombre")
        ).casefold()
    )

    ttk.Label(
        parent,
        text="Seleccioná el inventario",
        font=("Segoe UI", 15, "bold"),
    ).pack(pady=(20, 5))

    ttk.Label(
        parent,
        text="Cada archivo Word administra su propio stock.",
        foreground=COLOR_TEXTO_SECUNDARIO,
    ).pack(pady=(0, 18))

    cont = tk.Frame(
        parent,
        bg=COLOR_FONDO,
    )

    cont.pack(
        fill="both",
        expand=True,
        padx=40,
        pady=10,
    )

    if not documentos:
        ttk.Label(
            cont,
            text="No se encontraron archivos Word en la base de datos.",
            font=("Segoe UI", 11),
        ).pack(pady=40)
        return

    columnas = 2

    for i, doc in enumerate(documentos):
        nombre = limpiar_texto(doc.get("nombre"))

        tarjeta = tk.Frame(
            cont,
            bg=COLOR_PANEL,
            highlightbackground=COLOR_BORDE,
            highlightthickness=1,
            padx=18,
            pady=15,
            cursor="hand2",
        )

        tarjeta.grid(
            row=i // columnas,
            column=i % columnas,
            sticky="nsew",
            padx=10,
            pady=10,
        )

        cont.grid_columnconfigure(i % columnas, weight=1)
        cont.grid_rowconfigure(i // columnas, weight=1)

        def abrir_documento(event=None, documento=doc):
            seleccionar_inventario(documento)

        icono = tk.Label(
            tarjeta,
            text="📄",
            bg=COLOR_PANEL,
            fg=COLOR_AZUL,
            font=("Segoe UI", 24),
            cursor="hand2",
        )
        icono.pack(side="left", padx=(0, 15))

        info = tk.Frame(
            tarjeta,
            bg=COLOR_PANEL,
        )
        info.pack(
            side="left",
            fill="both",
            expand=True,
        )

        # El nombre es el elemento principal visible de la tarjeta.
        etiqueta_nombre = tk.Label(
            info,
            text=nombre,
            bg=COLOR_PANEL,
            fg=COLOR_TEXTO,
            font=("Segoe UI", 12, "bold"),
            anchor="w",
            justify="left",
            wraplength=420,
            cursor="hand2",
        )
        etiqueta_nombre.pack(
            fill="x",
            anchor="w",
            pady=(0, 4),
        )

        ttk.Button(
            info,
            text=f"Abrir: {nombre}",
            command=abrir_documento,
        ).pack(
            fill="x",
            anchor="w",
            pady=(2, 0),
        )

        tarjeta.bind("<Button-1>", abrir_documento)
        icono.bind("<Button-1>", abrir_documento)
        etiqueta_nombre.bind("<Button-1>", abrir_documento)

'''

          text = text[:inicio] + nuevo + text[fin:]
          path.write_text(text, encoding="utf-8")
      - name: Commit selector fix and remove temporary workflow
        run: |
          if git diff --quiet -- main.py; then
            echo "No hay cambios para aplicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git rm .github/workflows/fix-inventario-selector.yml
          git commit -m "Mostrar nombres de inventarios en cualquier PC"
          git push
