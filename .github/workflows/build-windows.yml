name: Build Windows EXE and Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name SistemaInventarios --add-data "plantillas;plantillas" inicio.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SistemaInventarios/SistemaInventarios.exe")) {
            throw "No se generó el ejecutable."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          iscc installer\\SistemaInventarios.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventarios-Windows
          path: dist\\SistemaInventarios\\
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventarios-Setup
          path: installer_output\\SistemaInventarios-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 30
