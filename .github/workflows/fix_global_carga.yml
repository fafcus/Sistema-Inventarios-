name: Corregir globals de carga inicial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corregir main.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          bloque = '''        except Exception as error:\n\n            global datos_iniciales_cargados\n            global error_carga_inicial\n\n            datos_iniciales_cargados = False\n'''
          reemplazo = '''        except Exception as error:\n\n            datos_iniciales_cargados = False\n'''

          if bloque not in text:
              raise SystemExit("No se encontró el bloque incorrecto de globals en main.py")

          text = text.replace(bloque, reemplazo, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit corrección y limpiar workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Corregir carga inicial del selector" || exit 1
          git rm .github/workflows/fix_global_carga.yml
          git commit -m "Limpiar workflow temporal de correccion" || true
          git push
